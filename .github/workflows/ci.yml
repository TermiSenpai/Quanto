name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Windows is the only supported target, so test there too.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      # Informational only: this is an offline internal app, so build-time
      # transitive advisories are tolerable (CLAUDE.md §8.3). Don't fail CI on them.
      - name: Audit (non-blocking)
        run: pnpm audit --audit-level high
        continue-on-error: true
